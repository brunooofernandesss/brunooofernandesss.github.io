    "2. Úlcera de decúbito isquêmica terminal por infecção aguda.",           "3. Progressão desregulada e metástase de neoplasias agressivas e tumores pouco diferenciados.",           "4. Inflamação purulenta limitada aos anexos pilosos da pele."         ],         correctAnswer: "3. Progressão desregulada e metástase de neoplasias agressivas e tumores pouco diferenciados.",         comment: "Embora o Fator de Crescimento Endotelial Vascular (VEGF) cure a ferida ao atrair vasos novos, os tumores de alta agressividade também o cooptam patologicamente para 'alimentar' sua massa maligna crescente com sangue farto.",         topic: "Neovascularização em Contextos Patológicos"       },       {         question: "73. A dor referida na perna (mialgia no gastrocnêmio) relatada com certa frequência na prática ambulatorial por idosos, associada ao uso de certos hipolipemiantes, correlaciona-se comumente ao efeito adverso clássico do uso crônico contínuo de:",         options: [           "1. Inibidores da ECA (Captopril).",           "2. Bloqueadores de leucotrienos (Montelucaste).",           "3. Estatinas (Sinvastatina).",           "4. AINEs inespecíficos."         ],         correctAnswer: "3. Estatinas (Sinvastatina).",         comment: "Estatinas são medicações extensamente prescritas para o controle do colesterol sanguíneo e têm como evento adverso documentado a inflamação/lesão das fibras musculares estriadas distais, devendo gerar queixas atentas do médico responsável.",         topic: "Efeitos Adversos Farmacológicos: Estatinas"       },       {         question: "74. O processo de histologia prática cobra a diferenciação de falhas no preparo de artefatos teciduais no microscópio. Sujeiras, poeira e precipitados dos corantes muitas vezes induzem ao equívoco comum dos alunos principiantes de patologia. Elas são confundidas e descritas errônea e frequentemente como:",         options: [           "1. Exsudatos fibrino-purulentos verdadeiros no parênquima sadio.",           "2. Estruturas celulares atípicas e corpos apoptóticos intracelulares.",           "3. Depósitos primários extensivos de cartilagem hialina jovem neoformada.",           "4. Redes extensas cristalinas de cálcio no tecido vascular inato."         ],         correctAnswer: "2. Estruturas celulares atípicas e corpos apoptóticos intracelulares.",         comment: "Artefatos do laboratório são as armadilhas comuns aos calouros no microscópio. Um acúmulo condensado de pigmento escuro em um corte falho é rotineiramente confundido por inexperiência com uma anomalia biológica séria ou necrose aguda.",         topic: "Metodologia Histopatológica e Artefatos"       },       {         question: "75. O complexo processo inflamatório exige mediadores variados. Avaliando-se sistemicamente a origem dessas substâncias vasoativas vitais, a serotonina e a histamina possuem em comum a sua característica de produção, descritas tecnicamente como aminas:",         options: [           "1. Lentamente produzidas de novo pela maquinaria mitocondrial após longo estímulo microbiano.",           "2. Formadas puramente do metabolismo enzimático imediato mediado pela via lipoxigenase.",           "3. De baixo peso molecular que circulam exclusivamente ligadas às albuminas séricas como inativas.",           "4. Vasoativas pré-formadas e amplamente armazenadas de prontidão em grânulos intracelulares nas suas células de depósito primário."         ],         correctAnswer: "4. Vasoativas pré-formadas e amplamente armazenadas de prontidão em grânulos intracelulares nas suas células de depósito primário.",         comment: "Tais substâncias são classificadas laboratorialmente como pré-formadas; ou seja, a célula guarda estoques empacotados dessas aminas, o que permite o seu despejo instantâneo no tecido na resposta primária imune.",         topic: "Biologia de Mediadores Pré-Formados"       },       {         question: "76. O sistema imunológico baseia-se muitas vezes num princípio de economia: atuar vigorosamente no início, limpar e rapidamente desmobilizar o terreno no dia consecutivo. Quando isso falha, há lesão e patologia crônicas severas. No decorrer do 21º dia da persistência da inflamação granulomatosa lítica descrita nos resumos, quais linhagens linfocitárias assumiram o foco de orquestração na placa macrofágica circunjacente?",         options: [           "1. Eosinófilos IgE dependentes.",           "2. Neutrófilos polimorfonucleares hipersegmentados do estroma tardio.",           "3. Linfócitos T Auxiliares CD4+ ativados.",           "4. Plasmocitos inativos sem antígenos circulantes visíveis."         ],         correctAnswer: "3. Linfócitos T Auxiliares CD4+ ativados.",         comment: "O foco é orquestrado por Linfócitos T CD4+, que são as grandes bússolas do sistema e persistem por extensos períodos, aglomerando os tecidos reativos nas laterais do evento granulomatoso e convocando novos macrófagos continuamente.",         topic: "Imunologia Celular Crônica: Linfócitos T CD4+"       },       {         question: "77. A hemácia carrega, de forma altamente concentrada, milhões de moléculas de hemoglobina. Fatores genéticos induzem dobras anômalas severas nesse arranjo peptídico. Em face da biologia orgânica (proteostase), as hemácias contendo falha severa na montagem proteica tornam-se estruturalmente distorcidas num perfil microscópico em forma de foice. A esse mal genético se dá o diagnóstico clínico primário de:",         options: [           "1. Anemia Hipocrômica Ferropriva.",           "2. Malária esplênica secundária isquêmica por hipóxia sistêmica e infarto periférico venoso longo.",           "3. Síndrome Talassêmica restritiva difusa global primária com deposição celular densa de corpos inclusivos fibrosos.",           "4. Anemia Falciforme, cujo erro altera profundamente toda a morfologia da estrutura globular original, gerando oclusão crônica celular perniciosa periférica progressiva em extremidades do corpo."         ],         correctAnswer: "4. Anemia Falciforme, cujo erro altera profundamente toda a morfologia da estrutura globular original, gerando oclusão crônica celular perniciosa periférica progressiva em extremidades do corpo.",         comment: "O defeito ocorre na estrutura proteica central (hemoglobina anômala S), causando dobramentos incorretos que alteram irremediavelmente o formato macio da hemácia. Ela vira uma foice rígida incapaz de circular finamente.",         topic: "Patologia Hematológica Genética"       },       {         question: "78. A inalação da sílica representa uma grave morbidade em saúde ocupacional. O depósito desses cristais minerais insolúveis nos septos finos pulmonares vai impulsionar uma resposta contínua primária inflamatória. Os cristais são fagocitados avidamente pelas células pulmonares de defesa profunda, os chamados:",         options: [           "1. Plasmócitos basais IgA.",           "2. Linfócitos T Citotóxicos parietais basais ativados por vias clássicas imunes Th1 dependentes crônicas.",           "3. Macrófagos alveolares, que iniciam um ciclo vicioso fibrótico agressivo contínuo que nunca chega à eliminação biológica lítica enzimática por ausência de digestibilidade do alvo da agressão.",           "4. Neumócitos tipo I da camada terminal."         ],         correctAnswer: "3. Macrófagos alveolares, que iniciam um ciclo vicioso fibrótico agressivo contínuo que nunca chega à eliminação biológica lítica enzimática por ausência de digestibilidade do alvo da agressão.",         comment: "As poeiras inorgânicas penetram muito fundo e instalam-se no íntimo do alvéolo, sendo alvo crônico da fagocitose fútil dos macrófagos alveolares (que não conseguem digerir sílica), alimentando fibrose.",         topic: "Patologias Ocupacionais/Ambientais: Silicose"       },       {         question: "79. Segundo os princípios cirúrgicos, após uma lesão profunda na matriz basal dermoepidérmica orgânica severa não contígua geradora de escara crônica ou úlcera cutânea ampla, em sua cicatrização secundária haverá uma fase extensa reativa, úmida e hipervascular de reparo transitório do vazio tissular descrita clinicamente como:",         options: [           "1. Colágeno em Paliçada isquêmica seca fibrótica.",           "2. Tecido Conjuntivo Pálido e escasso.",           "3. Tecido de Granulação celular exuberante.",           "4. Neoformação Cartilaginosa hialina pura."         ],         correctAnswer: "3. Tecido de Granulação celular exuberante.",         comment: "A ferida aberta deve ser preenchida em toda sua extensão vazia profunda, o que se processa primariamente com a intensa maturação transitória do 'tecido de granulação' — um tecido imaturo incrivelmente vermelho e vivo.",         topic: "Morfologia do Reparo: Tecido de Granulação"       },       {         question: "80. Do ponto de vista puramente de sanção administrativa técnica da profissão em território nacional, o órgão que avaliará a postura ética, a sindicância procedimental e cassará a credencial do profissional inábil em casos de erro médico crasso e negligência será o:",         options: [           "1. Supremo Tribunal de Justiça - em sua esfera civil compensatória financeira estatal direta por danos colaterais orgânicos irreversíveis severos.",           "2. CRM - Conselho Regional de Medicina, em atuação no limite da sua circunscrição administrativa restritiva de atuação deontológica e controle da medicina.",           "3. Promotor de Justiça Criminal e a delegacia responsável, mediante a suspensão da prescrição da receita da penicilina cristalina endovenosa.",           "4. O próprio corpo clínico gerencial, limitando-se ao rebaixamento estatutário de nível hospitalar secundário ambulatorial."         ],         correctAnswer: "2. CRM - Conselho Regional de Medicina, em atuação no limite da sua circunscrição administrativa restritiva de atuação deontológica e controle da medicina.",         comment: "Quem age administrativamente sobre a licença e atuação através de sindicâncias diretas pela falta de ética, imprudência ou imperícia na medicina é fundamentalmente o Conselho Regional de Medicina.",         topic: "Ética Médica e Responsabilidade Profissional"       }     ];

    function buildQuiz() {
      const output = [];

      questions.forEach((currentQuestion, questionNumber) => {
        const options = [];
        for (let i = 0; i < currentQuestion.options.length; i++) {
          options.push(
            `<label class="option" data-question="${questionNumber}" data-value="${currentQuestion.options[i]}">
              <img src="tesouras.png" class="scissor-icon" onclick="event.stopPropagation(); this.parentNode.classList.toggle('struck-through');">
              ${currentQuestion.options[i]}
            </label>`
          );
        }

        output.push(
          `<div class="card" id="question-${questionNumber}" data-topic="${currentQuestion.topic}">
            <div class="question">${currentQuestion.question}</div>
            <div class="options">${options.join("")}</div>
            <div class="comment" id="comment-${questionNumber}"></div>
          </div>`
        );
      });

      quizContainer.innerHTML = output.join("");
    }

    function showResults() {
      wrongQuestionIndices = [];
      errorCountByTopic = {};
      totalAnsweredQuestionsByTopic = {};
      currentWrongQuestionIndex = -1;
      hasErrors = false;
      isShowingErrors = false;
      isShowingDiagnosis = false;

      errorDiagnosisSection.style.display = 'none';
      topicsToReviewList.innerHTML = '';
      statusMessage.textContent = '';

      // Busca por todas as perguntas: estáticas e dinâmicas
      const allQuestionCards = document.querySelectorAll('.quiz-container .card, #newQuestionsContent .card');
      let correctAnswersCount = 0;
      let totalQuestionsAnswered = 0;

      console.log('🔍 Verificando', allQuestionCards.length, 'perguntas...');

      allQuestionCards.forEach((card, index) => {
        const questionEl = card.querySelector('.question') || card.querySelector('p');
        if (!questionEl) return;

        const questionText = questionEl.textContent.trim();
        const optionsContainer = card.querySelector('.options') || card;
        const allOptions = optionsContainer.querySelectorAll('.option, label.option, label');
        const userAnswerElement = optionsContainer.querySelector('.option.selected, label.selected');
        const commentDiv = card.querySelector('.comment');

        const questionTopic = card.dataset.topic || "Tópico não informado";
        
        console.log(`📝 Pergunta ${index + 1}: Tópico = "${questionTopic}"`);
        console.log(`🔍 Encontradas ${allOptions.length} alternativas`);
        
        // Remove classes anteriores
        allOptions.forEach(option => {
          option.classList.remove('correct', 'incorrect', 'selected');
        });
        if (commentDiv) commentDiv.classList.remove('show');

        let correctAnswerValue = null;
        let questionComment = null;

        // Verifica se é pergunta estática ou dinâmica
        const isStatic = card.id && card.id.startsWith('question-');
        if (isStatic) {
          // Pergunta estática - busca nos dados originais
          const questionData = questions.find(q => q.question.trim() === questionText);
          if (questionData) {
            correctAnswerValue = questionData.correctAnswer.trim();
            questionComment = questionData.comment;
          }
        } else {
          // Pergunta dinâmica - busca pela opção marcada como correta
          const correctOpt = optionsContainer.querySelector('.option[data-answer="true"], label[data-answer="true"]');
          if (correctOpt) {
            correctAnswerValue = correctOpt.dataset.value?.trim() || correctOpt.textContent.trim();
            console.log(`✅ Resposta correta encontrada: "${correctAnswerValue}"`);
          } else {
            console.log('❌ Nenhuma resposta correta encontrada para pergunta dinâmica');
          }
          
          // Busca comentário no próprio card ou no div comment
          const commentElement = card.querySelector('.comment');
          if (commentElement && commentElement.textContent.trim()) {
            questionComment = commentElement.textContent.trim();
          }
        }

        // Processa resposta do usuário e aplica coloração
        let userAnswer = null;
        if (userAnswerElement) {
          userAnswerElement.classList.add('selected');
          userAnswer = userAnswerElement.dataset.value?.trim() || userAnswerElement.textContent.trim();
          totalQuestionsAnswered++;
          totalAnsweredQuestionsByTopic[questionTopic] = (totalAnsweredQuestionsByTopic[questionTopic] || 0) + 1;

          console.log(`👤 Resposta do usuário: "${userAnswer}"`);
          console.log(`🎯 Resposta correta: "${correctAnswerValue}"`);

          // Verifica se a resposta está correta
          if (userAnswer === correctAnswerValue) {
            correctAnswersCount++;
            console.log(`✅ Resposta correta!`);
          } else {
            hasErrors = true;
            errorCountByTopic[questionTopic] = (errorCountByTopic[questionTopic] || 0) + 1;
            console.log(`❌ Resposta incorreta para tópico: ${questionTopic}`);
          }
        }

        // Aplica coloração: SEMPRE marca a correta de verde, e a errada de vermelho se foi marcada
        allOptions.forEach(option => {
          const optionValue = option.dataset.value?.trim() || option.textContent.trim();
          
          // Marca a resposta correta de verde SEMPRE
          if (optionValue === correctAnswerValue) {
            option.classList.add('correct');
            console.log(`🟢 Marcando como correta: "${optionValue}"`);
          }
          
          // Se o usuário marcou uma resposta E ela está errada, marca de vermelho
          if (userAnswer && optionValue === userAnswer && userAnswer !== correctAnswerValue) {
            option.classList.add('incorrect');
            console.log(`🔴 Marcando como incorreta: "${optionValue}"`);
          }
        });

        // Mostra comentário se disponível
        if (commentDiv && questionComment) {
          commentDiv.textContent = questionComment;
          commentDiv.classList.add('show');
        }
      });

      // Exibe resultados
      resultsContainer.textContent = `Você acertou ${correctAnswersCount} de ${totalQuestionsAnswered} questões respondidas.`;

      console.log('📊 Erros por tópico:', errorCountByTopic);
      console.log('📊 Total por tópico:', totalAnsweredQuestionsByTopic);

      // Gera diagnóstico de erros
      if (hasErrors) {
        for (const topic in errorCountByTopic) {
          const errors = errorCountByTopic[topic];
          const total = totalAnsweredQuestionsByTopic[topic] || 0;
          if (total > 0) {
            const percent = ((errors / total) * 100).toFixed(1);
            const li = document.createElement('li');
            li.textContent = `${topic}: ${percent}% de erros (${errors} de ${total} questões respondidas)`;
            topicsToReviewList.appendChild(li);
          }
        }
      } else {
        const li = document.createElement('li');
        li.textContent = "🥳 Parabéns! Você não teve erros nas questões respondidas.";
        topicsToReviewList.appendChild(li);
      }

      errorDiagnosisSection.style.display = 'block';
      generatedQuestionsSection.style.display = 'block';
      generateNewQuestionsBtn.style.display = 'block';
      scrollToDiagnosis();
    }

    function scrollToQuestion(index) {
      const questionCard = document.getElementById(`question-${index}`);
      if (questionCard) {
        questionCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function scrollToDiagnosis() {
        errorDiagnosisSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function scrollToGeneratedQuestions() {
        generatedQuestionsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Event listener para seleção de opções (funciona para estáticas e dinâmicas)
    document.addEventListener("click", function (event) {
      const clickedElement = event.target;
      const optionElement = clickedElement.closest('.option');

      if (optionElement) {
          if (clickedElement.classList.contains("scissor-icon")) {
              event.stopPropagation();
              optionElement.classList.toggle("struck-through");
          }
          else {
              const parentCard = optionElement.closest('.card');
              const currentQuestionOptions = parentCard.querySelectorAll('.option');

              currentQuestionOptions.forEach(opt => opt.classList.remove("selected"));
              optionElement.classList.add("selected");
          }
      }
    });

    generateNewQuestionsBtn.addEventListener("click", async function() {
        statusMessage.textContent = '⏳ Gerando novas perguntas...';
        generateNewQuestionsBtn.disabled = true;

        const topics = Object.keys(errorCountByTopic).filter(topic => {
            const errorsInTopic = errorCountByTopic[topic] || 0;
            const totalAnsweredInTopic = totalAnsweredQuestionsByTopic[topic] || 0;
            return errorsInTopic > 0 && totalAnsweredInTopic > 0;
        });

        const topicsToSend = topics.length > 0 ? topics : ["fisiologia celular", "biologia"];

        try {
            const response = await fetch('https://www.quizia.xyz/quiz', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ topicos: topicsToSend }),
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            newQuestionsContent.innerHTML = '';
            if (data && data.html) {
                console.log('📥 HTML recebido do Flask:', data.html);
                
                // Insere o HTML diretamente sem reconstrução complexa
                newQuestionsContent.innerHTML = data.html.replace(/```html|```/g, '');
                
                // Adiciona tesouras e ajusta formatação apenas se necessário
                newQuestionsContent.querySelectorAll('.card').forEach((card, cardIndex) => {
                    // Garante que o elemento de pergunta tenha a classe correta
                    const questionElement = card.querySelector('p');
                    if (questionElement && !questionElement.classList.contains('question')) {
                       questionElement.classList.add('question');
                    }

                    // Remove qualquer input de radio que possa existir e adiciona tesouras
                    card.querySelectorAll('label').forEach((label) => {
                        // Remove inputs de radio MAS preserva o atributo data-answer
                        const radioInput = label.querySelector('input[type="radio"]');
                        if (radioInput) {
                            // PRESERVA o atributo data-answer do input no label
                            if (radioInput.hasAttribute('data-answer')) {
                                label.setAttribute('data-answer', radioInput.getAttribute('data-answer'));
                            }
                            radioInput.remove();
                        }
                        
                        // Garante que tenha a classe option
                        if (!label.classList.contains('option')) {
                            label.classList.add('option');
                        }

                        // Garante que tenha data-value
                        if (!label.dataset.value) {
                            label.dataset.value = label.textContent.trim();
                        }

                        // Adiciona tesoura se não existir
                        if (!label.querySelector('.scissor-icon')) {
                            const scissorIcon = document.createElement('img');
                            scissorIcon.src = 'tesouras.png';
                            scissorIcon.className = 'scissor-icon';
                            scissorIcon.onclick = function(e) {
                                e.stopPropagation();
                                label.classList.toggle('struck-through');
                            };
                            label.insertBefore(scissorIcon, label.firstChild);
                        }
                    });

                    console.log(`🏷️ Card ${cardIndex}: data-topic = "${card.dataset.topic}"`);
                    
                    // Verifica se há opção correta marcada
                    const correctOption = card.querySelector('label[data-answer="true"]');
                    if (correctOption) {
                        console.log(`✅ Opção correta encontrada: "${correctOption.dataset.value}"`);
                    } else {
                        console.log('❌ Nenhuma opção correta encontrada');
                    }
                });
            } else {
                newQuestionsContent.innerHTML = "<p>Não foi possível gerar novas perguntas para os tópicos selecionados.</p>";
            }
            
            generatedQuestionsSection.style.display = 'block';
            scrollToGeneratedQuestions();
            statusMessage.textContent = '✅ Perguntas geradas com sucesso!';
            setTimeout(() => { statusMessage.textContent = '' }, 3000);

        } catch (error) {
            console.error('Erro ao gerar novas perguntas:', error);
            newQuestionsContent.innerHTML = `<p>Erro ao carregar novas perguntas: ${error.message}. Por favor, tente novamente.</p>`;
            generatedQuestionsSection.style.display = 'block';
            scrollToGeneratedQuestions();
            statusMessage.textContent = '❌ Erro na requisição: ' + error.message;
            setTimeout(() => { statusMessage.textContent = '' }, 5000);
        } finally {
            generateNewQuestionsBtn.disabled = false;
        }
    });

    // Inicialização
    buildQuiz();
    errorDiagnosisSection.style.display = 'none';
    generatedQuestionsSection.style.display = 'none';
    generateNewQuestionsBtn.style.display = 'none';

    // Event listener para o botão de verificar respostas
    document.getElementById("verifyAnswersBtn").addEventListener("click", showResults);
  </script>
  <script src="conexao_firebase.js"></script><script src="navegacao.js"></script><script type="module" src="padrao_simulado.js"></script>
