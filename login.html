<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Simulados Medicina</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
  body { background: linear-gradient(135deg, #e0f7fa 0%, #ffffff 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #333; padding: 20px; }

  .login-card {
    background-color: white; padding: 2.5rem; border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center;
  }
  .login-header i { font-size: 3rem; color: #0056b3; margin-bottom: 10px; display: block; }
  .login-header h1 { font-size: 1.5rem; color: #0056b3; margin-bottom: 0.3rem; }
  .login-header p { font-size: 0.9rem; color: #666; margin-bottom: 1.5rem; }

  /* Abas Login / Cadastro */
  .tab-row { display: flex; border: 1px solid #e0e0e0; border-radius: 8px; overflow: hidden; margin-bottom: 1.5rem; }
  .tab-btn {
    flex: 1; padding: 10px; background: #f7f7f7; border: none; cursor: pointer;
    font-size: 0.9rem; font-weight: 500; color: #666; transition: all 0.2s;
  }
  .tab-btn.active { background: #0056b3; color: white; }

  /* Painéis */
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .input-group { margin-bottom: 1rem; text-align: left; }
  .input-group label { font-size: 0.8rem; color: #555; font-weight: 500; display: block; margin-bottom: 4px; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 0.95rem; transition: border-color 0.2s; outline: none;
  }
  input:focus { border-color: #0056b3; box-shadow: 0 0 0 3px rgba(0,86,179,0.1); }

  .btn-primary {
    width: 100%; padding: 12px; background: #0056b3; color: white; border: none;
    border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background 0.2s; margin-top: 0.25rem;
  }
  .btn-primary:hover { background: #004494; }
  .btn-primary:disabled { background: #90b8e0; cursor: not-allowed; }

  .divider { display: flex; align-items: center; margin: 1.25rem 0; color: #bbb; font-size: 0.8rem; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #eee; }
  .divider span { padding: 0 10px; }

  .social-login { display: flex; gap: 12px; }
  .social-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: white;
    cursor: pointer; font-size: 0.9rem; color: #555; transition: all 0.2s;
  }
  .social-btn:hover { background: #f8f9fa; border-color: #ccc; transform: translateY(-1px); }
  .social-btn i { font-size: 1.1rem; }
  .btn-google i { color: #DB4437; }
  .btn-github i { color: #333; }

  #status { margin-top: 1rem; font-size: 0.875rem; min-height: 1.2rem; font-weight: 500; }

  /* Modal de bloqueio (autorizado: false) */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 9999; align-items: center; justify-content: center; }
  .modal-content { background: white; width: 90%; max-width: 400px; border-radius: 12px; overflow: hidden; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .modal-header-block { background: #e74c3c; color: white; padding: 20px; }
  .modal-body { padding: 28px 20px; }
  .price-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 16px 0; border: 1px solid #eee; }
  .btn-pay { width: 100%; padding: 14px; background: #009ee3; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .btn-pay:hover { background: #007eb5; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <i class="fa-solid fa-user-doctor"></i>
    <h1>Simulados Medicina</h1>
    <p>Acesse ou crie sua conta gratuita</p>
  </div>

  <!-- Abas -->
  <div class="tab-row">
    <button class="tab-btn active" id="tabLoginBtn" onclick="window.mudarAba('login')">
      <i class="fas fa-sign-in-alt"></i> Entrar
    </button>
    <button class="tab-btn" id="tabCadastroBtn" onclick="window.mudarAba('cadastro')">
      <i class="fas fa-user-plus"></i> Criar Conta
    </button>
  </div>

  <!-- Painel: Entrar -->
  <div class="tab-panel active" id="painelLogin">
    <div class="input-group">
      <label>E-mail</label>
      <input id="loginEmail" type="email" placeholder="seu@email.com">
    </div>
    <div class="input-group">
      <label>Senha</label>
      <input id="loginSenha" type="password" placeholder="Sua senha">
    </div>
    <button class="btn-primary" id="btnLoginEmail">
      <i class="fas fa-sign-in-alt"></i> Entrar
    </button>

    <div class="divider"><span>ou continue com</span></div>

    <div class="social-login">
      <button id="btnGoogle" class="social-btn btn-google">
        <i class="fab fa-google"></i> Google
      </button>
      <button id="btnGitHub" class="social-btn btn-github">
        <i class="fab fa-github"></i> GitHub
      </button>
    </div>
  </div>

  <!-- Painel: Criar Conta -->
  <div class="tab-panel" id="painelCadastro">
    <div class="input-group">
      <label>Nome completo</label>
      <input id="cadNome" type="text" placeholder="Seu nome">
    </div>
    <div class="input-group">
      <label>E-mail</label>
      <input id="cadEmail" type="email" placeholder="seu@email.com">
    </div>
    <div class="input-group">
      <label>Senha (mínimo 6 caracteres)</label>
      <input id="cadSenha" type="password" placeholder="Crie uma senha">
    </div>
    <div class="input-group">
      <label>Confirmar senha</label>
      <input id="cadSenhaConfirm" type="password" placeholder="Repita a senha">
    </div>
    <button class="btn-primary" id="btnCadastrar">
      <i class="fas fa-user-plus"></i> Criar Conta Gratuita
    </button>

    <div class="divider"><span>ou registre com</span></div>

    <div class="social-login">
      <button id="btnGoogleCadastro" class="social-btn btn-google">
        <i class="fab fa-google"></i> Google
      </button>
      <button id="btnGitHubCadastro" class="social-btn btn-github">
        <i class="fab fa-github"></i> GitHub
      </button>
    </div>
  </div>

  <p id="status"></p>
</div>

<!-- Modal: conta bloqueada pelo admin (autorizado: false) -->
<div id="modalBloqueado" class="modal">
  <div class="modal-content">
    <div class="modal-header-block">
      <h3 style="margin:0;"><i class="fas fa-ban"></i> Conta Bloqueada</h3>
    </div>
    <div class="modal-body">
      <p style="color:#666; margin-bottom:10px;">
        Olá, <strong id="modalUserEmail">estudante</strong>!
      </p>
      <p style="font-size:14px; color:#555; margin-bottom:16px;">
        Sua conta foi suspensa pelo administrador. Entre em contato para regularizar.
      </p>
      <div class="price-box">
        <div style="font-size:13px; color:#777;">Plano R1 Mensal</div>
        <div style="font-size:28px; font-weight:800; color:#333;">R$ 59,90</div>
        <div style="font-size:12px; color:#27ae60; font-weight:600;">Desbloqueio Imediato</div>
      </div>
      <input type="text" id="cupomInput" placeholder="Cupom de desconto?"
             style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; margin-bottom:14px; text-align:center;">
      <button onclick="window.iniciarPagamento()" id="btnPagarModal" class="btn-pay">
        <i class="fas fa-bolt"></i> Assinar Agora
      </button>
      <br>
      <button onclick="window.sairDaConta()"
              style="background:none; border:none; color:#999; text-decoration:underline; margin-top:14px; cursor:pointer; font-size:12px;">
        Sair e tentar outra conta
      </button>
    </div>
  </div>
</div>

<script type="module">
import { auth, db, loginGoogle, loginGitHub } from './firebase.js';
import {
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

const statusEl = document.getElementById("status");
let currentUserEmail = "";
// Flag para evitar que onAuthStateChanged redirecione durante o cadastro manual
let processandoCadastro = false;

function showStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.style.color = type === 'error' ? '#d32f2f' : '#2e7d32';
}

// =============================================
// ABA: LOGIN / CADASTRO
// =============================================
window.mudarAba = (aba) => {
  document.getElementById('tabLoginBtn').classList.toggle('active', aba === 'login');
  document.getElementById('tabCadastroBtn').classList.toggle('active', aba === 'cadastro');
  document.getElementById('painelLogin').classList.toggle('active', aba === 'login');
  document.getElementById('painelCadastro').classList.toggle('active', aba === 'cadastro');
  statusEl.textContent = '';
};

// =============================================
// FLUXO CENTRAL: verifica e auto-cria documento
// =============================================
async function processarUsuario(user) {
  const email = (user.email || "").toLowerCase();
  currentUserEmail = email;
  document.getElementById("modalUserEmail").textContent = user.displayName || email || "Estudante";

  showStatus("Verificando conta...", "success");

  try {
    const userRef = doc(db, "usuarios", email);
    const snap = await getDoc(userRef);

    if (!snap.exists()) {
      // ✅ Primeiro login — cria documento automaticamente como gratuito
      await setDoc(userRef, {
        email: email,
        nome: user.displayName || email,
        autorizado: true,
        plano: "gratuito",
        ultimoLogin: new Date().toISOString(),
        ultimoLoginHorario: new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }),
        // Esqueleto de assinatura (para sistema de pagamentos futuro)
        assinatura: {
          tipo: "gratuito",       // "gratuito" | "premium" | "vitalicio"
          expiracao: null,        // ISO string — preenchido pelo webhook do Mercado Pago
          vitalicio: false        // true = nunca expira, independente da data
        }
      });
      showStatus("✅ Conta criada! Entrando como gratuito...", "success");
      window.location.href = "planner.html";
      return;
    }

    // Documento existe
    const data = snap.data();
    await updateDoc(userRef, {
      ultimoLogin: new Date().toISOString(),
      ultimoLoginHorario: new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' })
    });

    if (data.autorizado !== true) {
      // Conta bloqueada manualmente pelo admin
      showStatus("⚠️ Conta bloqueada.", "error");
      document.getElementById('modalBloqueado').style.display = 'flex';
      return;
    }

    // Redireciona — o planner decide o plano lendo o Firestore
    showStatus("✅ Redirecionando...", "success");
    window.location.href = "planner.html";

  } catch (err) {
    console.error("Erro ao processar usuário:", err);
    showStatus("⚠️ Erro de conexão. Tentando entrar...", "error");
    window.location.href = "planner.html";
  }
}

// =============================================
// onAuthStateChanged — só age fora do cadastro manual
// =============================================
onAuthStateChanged(auth, async (user) => {
  if (!user || processandoCadastro) return;
  await processarUsuario(user);
});

// =============================================
// LOGIN COM EMAIL E SENHA
// =============================================
document.getElementById("btnLoginEmail").addEventListener("click", async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const senha = document.getElementById("loginSenha").value;
  if (!email || !senha) { showStatus("Preencha e-mail e senha.", "error"); return; }

  const btn = document.getElementById("btnLoginEmail");
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';
  showStatus("Verificando...", "success");

  try {
    await signInWithEmailAndPassword(auth, email, senha);
    // onAuthStateChanged vai cuidar do redirecionamento
  } catch (e) {
    const msgs = {
      'auth/user-not-found': 'E-mail não cadastrado.',
      'auth/wrong-password': 'Senha incorreta.',
      'auth/invalid-credential': 'E-mail ou senha inválidos.',
      'auth/too-many-requests': 'Muitas tentativas. Tente mais tarde.'
    };
    showStatus(msgs[e.code] || `Erro: ${e.message}`, "error");
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
  }
});

// =============================================
// CADASTRO COM EMAIL E SENHA
// =============================================
document.getElementById("btnCadastrar").addEventListener("click", async () => {
  const nome = document.getElementById("cadNome").value.trim();
  const email = document.getElementById("cadEmail").value.trim();
  const senha = document.getElementById("cadSenha").value;
  const senhaConfirm = document.getElementById("cadSenhaConfirm").value;

  if (!nome || !email || !senha) { showStatus("Preencha todos os campos.", "error"); return; }
  if (senha.length < 6) { showStatus("Senha deve ter no mínimo 6 caracteres.", "error"); return; }
  if (senha !== senhaConfirm) { showStatus("As senhas não coincidem.", "error"); return; }

  const btn = document.getElementById("btnCadastrar");
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando conta...';
  showStatus("Criando sua conta...", "success");

  processandoCadastro = true; // Evita que onAuthStateChanged intercepte

  try {
    // 1. Cria no Firebase Auth
    const cred = await createUserWithEmailAndPassword(auth, email, senha);

    // 2. Salva nome de exibição no Auth
    await updateProfile(cred.user, { displayName: nome });

    // 3. Cria documento no Firestore como gratuito
    await setDoc(doc(db, "usuarios", email.toLowerCase()), {
      email: email.toLowerCase(),
      nome: nome,
      autorizado: true,
      plano: "gratuito",
      ultimoLogin: new Date().toISOString(),
      ultimoLoginHorario: new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' }),
      assinatura: {
        tipo: "gratuito",
        expiracao: null,
        vitalicio: false
      }
    });

    showStatus("✅ Conta criada com sucesso! Entrando...", "success");
    processandoCadastro = false;
    window.location.href = "planner.html";

  } catch (e) {
    processandoCadastro = false;
    const msgs = {
      'auth/email-already-in-use': 'Este e-mail já está cadastrado. Tente fazer login.',
      'auth/invalid-email': 'E-mail inválido.',
      'auth/weak-password': 'Senha muito fraca.'
    };
    showStatus(msgs[e.code] || `Erro: ${e.message}`, "error");
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-user-plus"></i> Criar Conta Gratuita';
  }
});

// =============================================
// LOGIN COM GOOGLE / GITHUB
// =============================================
const loginSocial = async (providerFn, nome) => {
  try {
    showStatus(`Aguardando ${nome}...`, "success");
    await providerFn();
    // onAuthStateChanged cuida do resto
  } catch (e) {
    showStatus(`❌ ${nome}: cancelado ou erro.`, "error");
  }
};

document.getElementById("btnGoogle").addEventListener("click", () => loginSocial(loginGoogle, "Google"));
document.getElementById("btnGitHub").addEventListener("click", () => loginSocial(loginGitHub, "GitHub"));
document.getElementById("btnGoogleCadastro").addEventListener("click", () => loginSocial(loginGoogle, "Google"));
document.getElementById("btnGitHubCadastro").addEventListener("click", () => loginSocial(loginGitHub, "GitHub"));

// =============================================
// PAGAMENTO (mantido)
// =============================================
window.iniciarPagamento = async () => {
  const btn = document.getElementById('btnPagarModal');
  const cupom = document.getElementById('cupomInput').value;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
  btn.disabled = true;
  try {
    const res = await fetch('https://us-central1-simuladosmedicina-6a01b.cloudfunctions.net/criarAssinatura', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentUserEmail, cupom })
    });
    const data = await res.json();
    if (data.init_point) { window.location.href = data.init_point; }
    else { alert("Erro ao criar pagamento."); btn.innerHTML = '<i class="fas fa-bolt"></i> Assinar Agora'; btn.disabled = false; }
  } catch (e) {
    alert("Erro de conexão."); btn.innerHTML = '<i class="fas fa-bolt"></i> Assinar Agora'; btn.disabled = false;
  }
};

window.sairDaConta = async () => {
  document.getElementById('modalBloqueado').style.display = 'none';
  await signOut(auth);
  window.location.reload();
};
</script>
</body>
</html>
