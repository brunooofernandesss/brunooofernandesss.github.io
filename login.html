<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Simulados Medicina</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* --- SEUS ESTILOS ORIGINAIS --- */
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
  body { background: linear-gradient(135deg, #e0f7fa 0%, #ffffff 100%); height: 100vh; display: flex; justify-content: center; align-items: center; color: #333; }
  .login-card { background-color: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
  .login-header h1 { font-size: 1.5rem; color: #0056b3; margin-bottom: 0.5rem; }
  .login-header p { font-size: 0.9rem; color: #666; margin-bottom: 2rem; }
  .input-group { margin-bottom: 1rem; text-align: left; }
  input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; outline: none; }
  input:focus { border-color: #0056b3; box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.1); }
  #btnLogin { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer; transition: background-color 0.3s; margin-top: 0.5rem; }
  #btnLogin:hover { background-color: #004494; }
  .divider { display: flex; align-items: center; margin: 1.5rem 0; color: #999; font-size: 0.85rem; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid #eee; }
  .divider span { padding: 0 10px; }
  .social-login { display: flex; gap: 15px; justify-content: center; }
  .social-btn { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; transition: all 0.3s ease; font-size: 0.9rem; color: #555; }
  .social-btn i { font-size: 1.2rem; margin-right: 8px; }
  .social-btn:hover { background-color: #f8f9fa; border-color: #ccc; transform: translateY(-2px); }
  .btn-google i { color: #DB4437; }
  .btn-github i { color: #333; }
  #status { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2rem; }

  /* --- ESTILOS DO MODAL DE PAGAMENTO --- */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; }
  .modal-content { background: white; width: 90%; max-width: 400px; border-radius: 12px; overflow: hidden; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .modal-header { background: #009ee3; color: white; padding: 20px; }
  .modal-body { padding: 30px 20px; }
  .price-box { background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 20px 0; border: 1px solid #eee; }
  .btn-pay { width: 100%; padding: 15px; background: #009ee3; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
  .btn-pay:hover { background: #007eb5; }
</style>
<script type="module" src="js/firebase.js"></script>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <i class="fa-solid fa-user-doctor" style="font-size: 3rem; color: #0056b3; margin-bottom: 10px;"></i>
    <h1>Simulados Medicina</h1>
    <p>Bem-vindo de volta! Acesse sua conta.</p>
  </div>
  
  <div class="input-group" style="display:none;">
    <input id="email" placeholder="Seu email" type="email">
  </div>
  <div class="input-group" style="display:none;">
    <input id="senha" placeholder="Sua senha" type="password">
  </div>
  
  <button id="btnLogin" style="display:none;">Entrar</button>

  <div class="divider" style="margin-top: 0;">
    <span>Acesse usando sua conta</span>
  </div>
  
  <div class="social-login">
    <button id="btnGoogle" class="social-btn btn-google">
      <i class="fab fa-google"></i> Google
    </button>
    <button id="btnGitHub" class="social-btn btn-github">
      <i class="fab fa-github"></i> GitHub
    </button>
  </div>
  
  <p id="status"></p>
</div>

<div id="modalAssinatura" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0;"><i class="fas fa-lock"></i> Acesso Premium</h3>
        </div>
        <div class="modal-body">
            <p style="color: #666; margin-bottom: 10px;">
                Olá, <strong id="modalUserEmail">estudante</strong>!
            </p>
            <p style="font-size: 14px; color: #555;">
                Sua conta foi criada, mas você ainda não possui uma assinatura ativa para acessar os simulados.
            </p>
            
            <div class="price-box">
                <div style="font-size: 13px; color: #777;">Plano R1 Mensal</div>
                <div style="font-size: 28px; font-weight: 800; color: #333;">R$ 59,90</div>
                <div style="font-size: 12px; color: #27ae60; font-weight: 600;">Desbloqueio Imediato</div>
            </div>

            <input type="text" id="cupomInput" placeholder="Possui cupom de desconto?" 
                   style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; text-align: center;">

            <button onclick="window.iniciarPagamento()" id="btnPagarModal" class="btn-pay">
                <i class="fas fa-bolt"></i> Assinar Agora
            </button>

            <button type="button" onclick="window.location.replace('planner.html')" style="width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px;">
                <i class="fas fa-gift"></i> Acessar Simulados Gratuitos
            </button>
            
            <button onclick="window.sairDaConta()" style="background: none; border: none; color: #999; text-decoration: underline; margin-top: 15px; cursor: pointer; font-size: 12px;">
                Sair e tentar outra conta
            </button>
        </div>
    </div>
</div>

<script type="module">
import { auth, db, loginGoogle, loginGitHub } from './firebase.js';
import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

const status = document.getElementById("status");
let currentUserEmail = ""; // Variável global para guardar o email logado

function showStatus(message, type) {
  status.textContent = message;
  status.style.color = type === 'error' ? '#d32f2f' : '#2e7d32';
}

// ============================================
// 1. VERIFICAÇÃO INTELIGENTE (MODIFICADO)
// ============================================
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUserEmail = user.email; // Guarda email para o pagamento
    document.getElementById("modalUserEmail").textContent = user.displayName || user.email;
    
    try {
      showStatus("Verificando assinatura...", "success");
      const isAuth = await checkFirestorePermission(user);
      
      if (isAuth) {
        // CENÁRIO A: PAGOU
        showStatus("✅ Redirecionando...", "success");
        window.location.href = "planner.html";
      } else {
        // CENÁRIO B: LOGOU MAS NÃO PAGOU (AQUI ESTÁ A MUDANÇA)
        // Não fazemos mais signOut automático. Mostramos o Modal.
        showStatus("⚠️ Assinatura pendente.", "error");
        document.getElementById('modalAssinatura').style.display = 'flex';
      }
    } catch (error) {
      console.error(error);
      showStatus("Erro ao verificar conta.", "error");
    }
  }
});

async function checkFirestorePermission(user) {
  const email = user.email.toLowerCase();
  const userRef = doc(db, "usuarios", email);
  const snap = await getDoc(userRef);

  // Se o documento NÃO existe (é a primeira vez da pessoa logando com Google)
  if (!snap.exists()) {
    // Ela entra no sistema (foi cadastrada no Auth), mas não tem acesso pago.
    // Retornamos false para que o Modal de Assinatura/Acesso Gratuito apareça.
    return false; 
  }

  // Se o documento existe, verifica se a pessoa está marcada como autorizada (pagou)
  if (snap.data().autorizado === true) {
    return true;
  }

  // Se o documento existe mas 'autorizado' for false ou não existir
  return false;
}

// ============================================
// 2. FUNÇÕES DE PAGAMENTO (NOVO)
// ============================================
window.iniciarPagamento = async () => {
    const btn = document.getElementById('btnPagarModal');
    const cupom = document.getElementById('cupomInput').value;
    
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
    btn.disabled = true;

    try {
        // CHAMA SUA CLOUD FUNCTION DO FIREBASE
        // Substitua pela URL correta que você obteve no passo anterior
        const functionUrl = 'https://us-central1-simuladosmedicina-6a01b.cloudfunctions.net/criarAssinatura';
        
        const response = await fetch(functionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email: currentUserEmail, 
                cupom: cupom 
            })
        });

        const data = await response.json();
        
        if (data.init_point) {
            // Leva o usuário para o Mercado Pago
            window.location.href = data.init_point;
        } else {
            alert("Erro ao criar pagamento. Tente novamente.");
            btn.innerHTML = '<i class="fas fa-bolt"></i> Assinar Agora';
            btn.disabled = false;
        }
    } catch (e) {
        console.error(e);
        alert("Erro de conexão com o servidor.");
        btn.innerHTML = '<i class="fas fa-bolt"></i> Assinar Agora';
        btn.disabled = false;
    }
};

window.sairDaConta = async () => {
    document.getElementById('modalAssinatura').style.display = 'none';
    await signOut(auth);
    window.location.reload();
};

// ============================================
// 3. LOGIN BOTÕES (GOOGLE E GITHUB)
// ============================================

document.getElementById("btnGoogle").addEventListener("click", async () => {
  try {
    showStatus("Aguardando Google...", "success");
    await loginGoogle();
  } catch (e) { showStatus("❌ Cancelado.", "error"); }
});

document.getElementById("btnGitHub").addEventListener("click", async () => {
  try {
    showStatus("Aguardando GitHub...", "success");
    await loginGitHub();
  } catch (e) { showStatus("❌ Cancelado.", "error"); }
});
</script>
</body>
</html>
